<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5; /* light grey page background */
        }
        .color-box {
            width: 200px;
            margin: 20px auto;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border-radius: 8px;
        }
        .red { background-color: red; }
        .green { background-color: green; }
        .blue { background-color: blue; }
        .gold { background-color: goldenrod; }
    </style>
</head>
<body>
    <h1>COLOR REPORT</h1>

    <div class="color-box red">RED</div>
    <div class="color-box green">GREEN</div>
    <div class="color-box blue">BLUE</div>
    <div class="color-box gold">GOLD</div>
</body>
</html>
